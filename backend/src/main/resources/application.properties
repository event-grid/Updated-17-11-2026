spring.application.name=evntgrid

# Local settings come from the root .env file. Real environments
# set the same names as environment variables. No secret belongs in this file.
spring.config.import=optional:file:../.env[.properties]

# Administration API: the admin portal's server authenticates with this token (empty = API switched off).
# Use a long random value in .env: at least 24 characters.
evntgrid.admin.api-token=${ADMIN_API_TOKEN:}

# --- PostgreSQL (one database, one schema per module) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/evntgrid}
spring.datasource.username=${POSTGRES_USER:}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Hibernate only validates; Flyway owns the schema (BACKEND_ARCHITECTURE.md, section 7).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# db/demo holds clearly labelled demo venues, providers and packages for development. Production sets
# DEMO_DATA_MIGRATIONS to empty, so only db/migration runs there. A demo migration already applied elsewhere is
# not treated as an error when the folder is switched off.
spring.flyway.locations=classpath:db/migration${DEMO_DATA_MIGRATIONS:,classpath:db/demo}
spring.flyway.ignore-migration-patterns=*:missing

# --- Redis (approved; not used by any feature yet) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Web ---
spring.mvc.problemdetails.enabled=true
server.port=${SERVER_PORT:8080}

# --- Customer session cookie (CENTRAL_IDENTITY_AND_SECURITY.md, section 3.2) ---
# Production keeps the defaults: __Host- prefix and Secure. Local http development overrides both in .env.
# Sessions are held in memory for now; they move to Redis (Spring Session) before more than one backend runs.
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:__Host-evg_c}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.timeout=${SESSION_IDLE_TIMEOUT:7d}
server.servlet.session.tracking-modes=cookie

# --- Sign-in codes (OTP) ---
# OTP_DEV_MODE=true shows the code on screen and enables the dummy test number. Never true in production.
evntgrid.otp.dev-mode=${OTP_DEV_MODE:false}
evntgrid.otp.test-phone=${OTP_TEST_PHONE:}
evntgrid.otp.test-code=${OTP_TEST_CODE:}
evntgrid.otp.code-length=${OTP_CODE_LENGTH:6}
evntgrid.otp.ttl=${OTP_TTL:5m}
evntgrid.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
evntgrid.otp.resend-cooldown=${OTP_RESEND_COOLDOWN:30s}

# --- Email (SMTP) for sign-in codes; nothing is sent while SMTP_HOST is empty ---
evntgrid.smtp.host=${SMTP_HOST:}
evntgrid.smtp.port=${SMTP_PORT:587}
evntgrid.smtp.username=${SMTP_USERNAME:}
evntgrid.smtp.password=${SMTP_PASSWORD:}
evntgrid.smtp.from=${SMTP_FROM:}
evntgrid.smtp.starttls=${SMTP_STARTTLS:true}

# --- Checkout and Razorpay ---
# Share of the booking total paid online at checkout; the rest is paid to the provider later.
evntgrid.booking.advance-percent=${BOOKING_ADVANCE_PERCENT:20}
# The key ID is public (sent to Razorpay Checkout in the browser); the secrets never leave the backend.
evntgrid.razorpay.key-id=${RAZORPAY_KEY_ID:}
evntgrid.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
evntgrid.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
evntgrid.razorpay.api-base-url=${RAZORPAY_API_BASE_URL:https://api.razorpay.com}

# --- SMS gateway for sign-in codes (provider not decided; not used yet) ---
evntgrid.sms.provider=${SMS_PROVIDER:}
evntgrid.sms.api-key=${SMS_API_KEY:}
evntgrid.sms.sender-id=${SMS_SENDER_ID:}

# --- API documentation (springdoc, API_DESIGN.md section 7) ---
# OpenAPI 3.0 output for client generation (ADR-008). One document per surface ("group").
# Production sets API_DOCS_ENABLED=false: Swagger UI is never exposed there.
springdoc.api-docs.version=openapi_3_0
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.writer-with-order-by-keys=true

# --- Actuator: health only for now (private port comes with deployment work) ---
management.endpoints.web.exposure.include=health
